<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#226755">
  <title>小满记账 · 把生活记清楚</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="header">
      <a class="brand" href="index.html"><span class="logo" aria-hidden="true">满</span><span>小满记账<small>把生活记清楚</small></span></a>
      <span class="local-badge">● 本地账本</span>
    </header>
    <section class="intro"><div><p class="eyebrow">YOUR EVERYDAY, IN BALANCE</p><h1>每一笔，都是生活。</h1><p>记录日常收支，让每个月的努力都有迹可循。</p></div><span id="month-label" class="month-label"></span></section>
    <section class="summary" aria-label="本月收支统计">
      <article class="card balance"><span>本月结余</span><strong id="balance">¥0.00</strong><small>收入减去支出，心中更有数</small><span class="card-decoration" aria-hidden="true">↗</span></article>
      <article class="card"><span><i class="dot income-dot"></i> 本月收入</span><strong id="income">¥0.00</strong><small>每一份收获，都值得记录</small></article>
      <article class="card"><span><i class="dot expense-dot"></i> 本月支出</span><strong id="expense">¥0.00</strong><small>好好花钱，也好好生活</small></article>
    </section>
    <div class="workspace">
      <section class="panel entry-panel">
        <div class="section-heading"><h2>记一笔</h2><span class="muted">从今天开始</span></div>
        <form id="entry-form">
          <fieldset class="type-choice"><legend class="sr-only">收支类型</legend><label><input type="radio" name="type" value="expense" checked><span>− 支出</span></label><label><input type="radio" name="type" value="income"><span>＋ 收入</span></label></fieldset>
          <label class="field">金额（元）<div class="amount-input"><span>¥</span><input id="amount" name="amount" type="number" min="0.01" max="999999999.99" step="0.01" placeholder="0.00" required inputmode="decimal"></div></label>
          <div class="form-row"><label class="field">日期<input id="date" name="date" type="date" required></label><label class="field">类别<select id="category" name="category" required></select></label></div>
          <label class="field">备注 <span class="muted">（选填）</span><textarea id="note" name="note" rows="3" maxlength="200" placeholder="这笔钱花在了哪里？"></textarea></label>
          <button class="save-button" type="submit">＋ 保存这笔记录</button>
          <p id="message" class="message" role="status" aria-live="polite"></p>
        </form>
      </section>
      <section class="panel records-panel">
        <div class="section-heading"><div><h2>最近收支</h2><p class="muted" id="record-count">共 0 笔记录</p></div><label class="filter-label"><span class="sr-only">筛选收支类型</span><select id="filter"><option value="all">全部记录</option><option value="expense">仅支出</option><option value="income">仅收入</option></select></label></div>
        <div id="records" class="records" aria-live="polite"></div>
        <button id="show-more" class="more-button" type="button" hidden>查看更多记录</button>
      </section>
    </div>
    <footer>小满，比圆满更自在。<span>数据仅保存在当前浏览器，请勿清除网站数据。</span></footer>
  </main>
</body>
</html>
